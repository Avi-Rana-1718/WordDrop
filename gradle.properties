org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 ships built-in Kotlin and a new DSL. We opt out of both and apply the
# Kotlin Gradle plugin explicitly so the Kotlin / Compose compiler / KSP versions
# are pinned together in libs.versions.toml. Both flags stop working in AGP 10:
# migrate to built-in Kotlin (https://kotl.in/gradle/agp-built-in-kotlin) before then.
android.builtInKotlin=false
android.newDsl=false
